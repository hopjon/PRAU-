<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRAU Intel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    overflow-x:hidden;
    background:#0f0f0f;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:15px;
    box-sizing:border-box;
}

.logo{
    width:90px;
    display:block;
    margin:25px auto 10px auto;
}

h1{
    text-align:center;
    color:#D4AF37;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:30px;
}

.searchBox{
    width:100%;
    padding:18px 20px;
    font-size:20px;
    border-radius:12px;
    border:1px solid #333;
    background:#202020;
    color:white;
    margin-bottom:30px;
    box-sizing:border-box;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3, 100px);
    justify-content:center;
    gap:15px;
    margin-top:25px;
}

.card{
    width:100px;
    height:100px;

    background:#181818;
    border:1px solid #3a3120;
    border-radius:14px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;
    transition:.25s;
    box-sizing:border-box;
}
.card:hover{
    border-color:#D4AF37;
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(212,175,55,.18);
}

.card i{
    font-size:42px;
    color:#D4AF37;
    margin-bottom:15px;
}

.card h3{
    margin:0;
    color:white;
    font-size:20px;
    font-weight:600;
}

@media (max-width:768px){

.logo{
    width:70px;
}

h1{
    font-size:30px;
}

.subtitle{
    font-size:14px;
}

.searchBox{
    font-size:16px;
    padding:12px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3, 85px);
    justify-content:center;
    gap:10px;
}

.card{
    width:85px;
    height:85px;
}

.card i{
    font-size:24px;
    margin-bottom:8px;
}

.card h3{
    font-size:12px;
}

}

</style>

</head>

<body>

<div class="container">

<img src="assets/logo.svg" class="logo">

<h1>PRAU Intel</h1>

<div class="subtitle">
Professional Intelligence Platform
</div>

<input
class="searchBox"
type="text"
placeholder="Search people or vehicles...">

<div class="cards">

    <div class="card" id="peopleCard">
        <i class="fa-solid fa-user-secret"></i>
        <h3>People</h3>
    </div>

    <div class="card" id="vehicleCard">
        <i class="fa-solid fa-car-side"></i>
        <h3>Vehicles</h3>
    </div>

    <div class="card" id="recentCard">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <h3>Recent</h3>
    </div>

</div>

<div class="footer">

Logged in as Administrator

</div>

</div>

</body>

</html>
