<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRAU Intel</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:95%;
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.logo{
    width:90px;
    display:block;
    margin:25px auto 10px auto;
}

h1{
    text-align:center;
    color:#D4AF37;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:30px;
}

.searchBox{
    width:100%;
    padding:18px 20px;
    font-size:20px;
    border-radius:12px;
    border:1px solid #333;
    background:#202020;
    color:white;
    margin-bottom:30px;
    box-sizing:border-box;
}

.cards{
    display:flex;
    gap:20px;
    margin-top:25px;
}

.card{
    flex:1;
    background:#1a1a1a;
    border:1px solid #D4AF37;
    border-radius:12px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    transition:.25s;
    min-height:140px;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px rgba(212,175,55,.25);
}

.card h2{
    font-size:38px;
    margin:0;
}

.card h3{
    font-size:18px;
    color:#D4AF37;
    margin-top:10px;
    margin-bottom:0;
    font-weight:600;
}
    /* Mobile phones */
@media (max-width:768px){

.logo{
    width:90px;
}

h1{
    font-size:42px;
}

.subtitle{
    font-size:16px;
}

.searchBox{
    font-size:18px;
    padding:16px;
}

.cards{
    flex-direction:column;
}

.card{
    padding:25px;
}

.card h2{
    font-size:42px;
}

.card h3{
    font-size:20px;
}

}

@media (max-width:900px){

.cards{
    flex-direction:column;
}

}

</style>

</head>

<body>

<div class="container">

<img src="assets/logo.svg" class="logo">

<h1>PRAU Intel</h1>

<div class="subtitle">
Professional Intelligence Platform
</div>

<input
class="searchBox"
type="text"
placeholder="Search people or vehicles...">

<div class="cards">

<div class="card">

<h2>👤 Person Intelligence</h2>
<p>Add, search and manage people profiles.</p>

</div>

<div class="card">

<h2>🚗 Vehicle Intelligence</h2>
<p>Add, search and manage vehicle profiles.</p>

</div>

<div class="card">

<h2>⭐ Recent Profiles</h2>
<p>Recently viewed people and vehicles.</p>

</div>

</div>

</div>

<div class="footer">

Logged in as Administrator

</div>

</div>

</body>

</html>
