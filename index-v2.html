<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRAU Intel</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.logo{
    width:90px;
    display:block;
    margin:25px auto 10px auto;
}

h1{
    text-align:center;
    color:#D4AF37;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:30px;
}

.searchBox{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    font-size:18px;
    box-sizing:border-box;
}

.card{
    background:#1a1a1a;
    border:1px solid #D4AF37;
    border-radius:12px;
    padding:25px;
    margin-top:20px;
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:scale(1.02);
}

.card h2{
    margin:0;
    color:#D4AF37;
}

.card p{
    color:#ccc;
}

.footer{
    margin-top:40px;
    text-align:center;
    color:#888;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<img src="assets/logo.svg" class="logo">

<h1>PRAU Intel</h1>

<div class="subtitle">
Professional Intelligence Platform
</div>

<input
class="searchBox"
type="text"
placeholder="Search people or vehicles...">

<div class="card">

<h2>👤 Person Intelligence</h2>

<p>Add, search and manage people profiles.</p>

</div>

<div class="card">

<h2>🚗 Vehicle Intelligence</h2>

<p>Add, search and manage vehicle profiles.</p>

</div>

<div class="card">

<h2>⭐ Recent Profiles</h2>

<p>Recently viewed people and vehicles.</p>

</div>

<div class="footer">

Logged in as Administrator

</div>

</div>

</body>

</html>
